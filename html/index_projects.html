<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - Claude Sessions</title>
    <link rel="stylesheet" href="../css/style.css">
    <script>
        (function() {
            try {
                const stored = localStorage.getItem('claude_chat_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = stored || (prefersDark ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            } catch (err) {
                console.warn('Theme init error', err);
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <button id="debug-toggle-btn" class="debug-toggle-btn-top" title="Debug Visual (Ctrl+D)"><span class="debug-toggle-icon">☰</span></button>

        <div id="debug-visual-panel" class="debug-visual-panel-top" style="display: none;">
            <div class="debug-visual-header">
                <h3>Debug Info</h3>
            </div>
            <div class="debug-visual-content" id="debug-visual-content">
                <div class="debug-log"></div>
            </div>
        </div>

        <div class="chat-container">
            <div id="sessions-list" class="messages sessions-list"></div>
        </div>
    </div>

    <script src="../js/debug-visual.js"></script>
    <script>
        window.addEventListener('load', async () => {
            const container = document.getElementById('sessions-list');

            try {
                const response = await fetch('http://localhost:8080/sessions');
                const data = await response.json();

                window.debugVisual?.log('success', data.count + ' sessões encontradas');

                if (data.sessions.length === 0) {
                    container.innerHTML = '<p class="empty-state">Nenhuma sessão encontrada</p>';
                    return;
                }

                data.sessions.forEach(session => {
                    const card = document.createElement('div');
                    card.className = 'session-card';
                    
                    const filePath = (session.file || '').replace(/\\/g, '/');
                    const projectFolder = filePath.split('/').slice(-2, -1)[0] || 'Projeto desconhecido';
                    const updated = new Date(session.updated_at).toLocaleString('pt-BR');

                    card.innerHTML = `
                        <div class="session-card-header">
                            <div>
                                <h3>🗂️ ${projectFolder}</h3>
                                <p class="session-card-subtitle">${session.file_name}</p>
                            </div>
                            <span class="session-card-badge">${session.message_count} mensagens</span>
                        </div>
                        <div class="session-card-meta">
                            <div>🤖 ${session.model}</div>
                            <div class="session-card-date">📅 ${updated}</div>
                        </div>
                    `;

                    card.onclick = () => {
                        window.location.href = 'session-viewer.html?session_id=' + session.session_id;
                    };

                    container.appendChild(card);
                });

            } catch (error) {
                console.error('Erro:', error);
                window.debugVisual?.log('error', 'Falha ao carregar: ' + error.message);
                container.innerHTML = '<p class="empty-state error">❌ Erro ao carregar sessões</p>';
            }
        });
    </script>
</body>
</html>
