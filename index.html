<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Simples - Session Viewer</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        /* Estilos extras para o session viewer inline */
        .session-banner {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }
        .session-banner .session-id {
            font-family: 'Courier New', monospace;
            opacity: 0.9;
        }
        .session-banner .session-stats {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .session-banner .stat {
            background: rgba(255,255,255,0.2);
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .session-picker {
            padding: 2rem;
            text-align: center;
        }
        .session-picker h2 {
            margin-bottom: 1.5rem;
            color: var(--text-primary);
        }
        .session-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-width: 600px;
            margin: 0 auto;
        }
        .session-item {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem 1.25rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-item:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-elevated);
        }
        .session-item-id {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: var(--primary);
            font-weight: 600;
        }
        .session-item-meta {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }
        .session-item-size {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 0.2rem 0.5rem;
            border-radius: 999px;
        }
        .tool-call-block {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            margin-top: 0.5rem;
            font-size: 0.8rem;
        }
        .tool-call-name {
            font-weight: 600;
            color: var(--primary);
        }
        .tool-call-args {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 80px;
            overflow: hidden;
        }
        .thinking-block {
            background: rgba(139, 92, 246, 0.08);
            border-left: 3px solid #8b5cf6;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-style: italic;
        }
        .message-model {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-family: 'Courier New', monospace;
            opacity: 0.7;
        }
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 3rem;
            color: var(--text-secondary);
        }
        .loading-spinner .dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .loading-spinner .dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-spinner .dots span:nth-child(3) { animation-delay: 0.4s; }

        /* Audio Player */
        .audio-player-block {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(139, 92, 246, 0.1));
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            margin-top: 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .audio-player-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--primary);
            font-weight: 600;
        }
        .audio-player-header .audio-icon {
            font-size: 1.1rem;
        }
        .audio-player-header .audio-filename {
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            opacity: 0.8;
        }
        .audio-player-block audio {
            width: 100%;
            height: 36px;
            border-radius: 8px;
        }
        .audio-player-block audio::-webkit-media-controls-panel {
            background: rgba(99, 102, 241, 0.05);
        }
        .audio-error {
            font-size: 0.75rem;
            color: var(--error);
            padding: 0.25rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="chat-container">
            <div id="session-banner" class="session-banner" style="display: none;">
                <div>
                    <strong>Audio Studio Session</strong>
                    <span class="session-id" id="banner-session-id"></span>
                </div>
                <div class="session-stats">
                    <span class="stat" id="banner-msg-count"></span>
                    <span class="stat" id="banner-model"></span>
                    <a href="/" style="color: white; text-decoration: none; font-weight: 600;">Voltar</a>
                </div>
            </div>
            <div id="messages" class="messages"></div>
            <div id="typing-indicator" class="typing-indicator" style="display: none;">
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
                <div class="typing-info">
                    <span class="typing-text">Processando...</span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <textarea id="message-input" placeholder="Digite sua mensagem..." rows="1"></textarea>
            <button id="send-button" class="send-button">
                <span class="button-text">Enviar</span>
                <span class="button-icon">&gt;</span>
            </button>
        </div>
    </div>

    <script>
        // Se servido via Live Server (5500), apontar para o backend FastAPI
        const API_URL = window.location.port === '8000'
            ? window.location.origin
            : 'http://localhost:8000';
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-button');

        // Detectar session da URL
        const urlParams = new URLSearchParams(window.location.search);
        const SESSION_ID = urlParams.get('session');

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function formatTime(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function formatDateTime(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp);
            if (isNaN(d.getTime())) return '';
            return d.toLocaleString('pt-BR', {
                day: '2-digit', month: '2-digit',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function truncateCommand(text, max = 120) {
            if (!text || text.length <= max) return text;
            return text.substring(0, max) + '...';
        }

        // Extrair texto limpo de mensagens do user (remover metadata)
        function cleanUserText(text) {
            if (!text) return '';
            // Remover blocos de metadata JSON
            let cleaned = text.replace(/Conversation info \(untrusted metadata\):\n```json\n[\s\S]*?```\n*/g, '');
            // Remover replied message blocks
            cleaned = cleaned.replace(/Replied message \(untrusted metadata\):\n```json\n[\s\S]*?```\n*/g, '');
            // Remover queued messages header
            cleaned = cleaned.replace(/\[Queued messages while agent was busy\]\n*---\n*Queued #\d+\n*/g, '');
            // Remover tags de audio
            cleaned = cleaned.replace(/\[Audio\]\nUser text:\n/g, '');
            // Remover WhatsApp metadata
            cleaned = cleaned.replace(/\[WhatsApp \+\d+ \+\d+s \w+ \d{4}-\d{2}-\d{2} \d{2}:\d{2} GMT[+-]\d+\] <media:audio>\nTranscript:\n?/g, '');
            return cleaned.trim();
        }

        function createAudioPlayer(filename) {
            const block = document.createElement('div');
            block.className = 'audio-player-block';

            const headerDiv = document.createElement('div');
            headerDiv.className = 'audio-player-header';

            const icon = document.createElement('span');
            icon.className = 'audio-icon';
            icon.textContent = '\uD83C\uDFA7';  // headphones emoji

            const fname = document.createElement('span');
            fname.className = 'audio-filename';
            fname.textContent = filename;

            headerDiv.appendChild(icon);
            headerDiv.appendChild(fname);

            const audio = document.createElement('audio');
            audio.controls = true;
            audio.preload = 'none';
            audio.src = `${API_URL}/audio/${encodeURIComponent(filename)}`;

            audio.onerror = () => {
                const err = document.createElement('div');
                err.className = 'audio-error';
                err.textContent = 'Arquivo de audio nao encontrado';
                block.appendChild(err);
            };

            block.appendChild(headerDiv);
            block.appendChild(audio);
            return block;
        }

        // Detectar nomes de arquivos de audio em texto
        function extractAudioFilename(text) {
            if (!text) return null;
            const match = text.match(/[\w\-]+\.(mp3|wav|ogg|m4a)/i);
            return match ? match[0] : null;
        }

        function createMessageElement(role, text, timestamp, extras = {}) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;

            const header = document.createElement('div');
            header.className = 'message-header';

            const name = document.createElement('strong');
            name.textContent = role === 'user' ? 'Voce' : 'Audio Studio';

            const meta = document.createElement('div');
            meta.className = 'message-meta';

            const time = document.createElement('span');
            time.className = 'timestamp';
            time.textContent = formatTime(timestamp);
            meta.appendChild(time);

            if (extras.model) {
                const model = document.createElement('span');
                model.className = 'message-model';
                model.textContent = extras.model;
                meta.appendChild(model);
            }

            header.appendChild(name);
            header.appendChild(meta);

            const content = document.createElement('div');
            content.className = 'message-content';

            // Thinking block
            if (extras.thinking) {
                const think = document.createElement('div');
                think.className = 'thinking-block';
                think.textContent = extras.thinking;
                content.appendChild(think);
            }

            // Texto principal
            const isAudioFilename = text && /^[\w\-]+\.(mp3|wav|ogg|m4a)$/i.test(text.trim());
            if (text && !isAudioFilename) {
                const body = document.createElement('div');
                body.className = 'message-body';
                body.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');
                content.appendChild(body);
            }

            // Audio player - por audio_file do backend ou nome de arquivo no texto
            const audioFile = extras.audio_file || extras.audio_filename || (isAudioFilename ? text.trim() : null);
            if (audioFile) {
                content.appendChild(createAudioPlayer(audioFile));
            }

            // Tool calls
            if (extras.tool_calls && extras.tool_calls.length > 0) {
                for (const tc of extras.tool_calls) {
                    const tcBlock = document.createElement('div');
                    tcBlock.className = 'tool-call-block';

                    const tcName = document.createElement('div');
                    tcName.className = 'tool-call-name';
                    tcName.textContent = tc.name;

                    const tcArgs = document.createElement('div');
                    tcArgs.className = 'tool-call-args';
                    const argStr = typeof tc.arguments === 'string'
                        ? tc.arguments
                        : JSON.stringify(tc.arguments, null, 2);
                    if (tc.arguments && tc.arguments.command) {
                        tcArgs.textContent = truncateCommand(tc.arguments.command, 200);
                    } else {
                        tcArgs.textContent = truncateCommand(argStr, 200);
                    }

                    tcBlock.appendChild(tcName);
                    tcBlock.appendChild(tcArgs);
                    content.appendChild(tcBlock);
                }
            }

            wrapper.appendChild(header);
            wrapper.appendChild(content);
            return wrapper;
        }

        // =====================================================================
        // CARREGAR SESSAO
        // =====================================================================

        async function loadSession(sessionId) {
            messagesContainer.innerHTML = `
                <div class="loading-spinner">
                    <div class="dots"><span></span><span></span><span></span></div>
                    <span>Carregando sessao...</span>
                </div>
            `;

            try {
                const res = await fetch(`${API_URL}/sessions/${sessionId}`);
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }

                const data = await res.json();
                messagesContainer.innerHTML = '';

                // Banner da sessao
                const banner = document.getElementById('session-banner');
                banner.style.display = 'flex';
                document.getElementById('banner-session-id').textContent =
                    sessionId.substring(0, 8) + '...';
                document.getElementById('banner-msg-count').textContent =
                    data.messages.length + ' msgs';

                // Encontrar modelo usado
                const modelMsg = data.messages.find(m => m.model);
                document.getElementById('banner-model').textContent =
                    modelMsg ? modelMsg.model : 'N/A';

                // Renderizar mensagens
                for (const msg of data.messages) {
                    const displayText = msg.role === 'user'
                        ? cleanUserText(msg.text)
                        : msg.text;

                    const hasAudio = msg.audio_file || msg.audio_filename;
                    if (!displayText && !msg.tool_calls && !hasAudio) continue;

                    const el = createMessageElement(msg.role, displayText, msg.timestamp, {
                        model: msg.model,
                        thinking: msg.thinking,
                        tool_calls: msg.tool_calls,
                        audio_file: msg.audio_file,
                        audio_filename: msg.audio_filename,
                    });
                    messagesContainer.appendChild(el);
                }

                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            } catch (err) {
                messagesContainer.innerHTML = `
                    <div style="text-align:center; padding:3rem; color: var(--error);">
                        Erro ao carregar sessao: ${escapeHtml(err.message)}
                    </div>
                `;
            }
        }

        // =====================================================================
        // LISTAR SESSOES
        // =====================================================================

        async function loadSessionList() {
            messagesContainer.innerHTML = `
                <div class="loading-spinner">
                    <div class="dots"><span></span><span></span><span></span></div>
                    <span>Carregando sessoes...</span>
                </div>
            `;

            try {
                const res = await fetch(`${API_URL}/sessions`);
                const data = await res.json();

                if (!data.sessions || data.sessions.length === 0) {
                    messagesContainer.innerHTML = `
                        <div class="session-picker">
                            <h2>Nenhuma sessao encontrada</h2>
                            <p style="color: var(--text-secondary);">
                                Coloque arquivos .jsonl no diretorio de sessoes.
                            </p>
                        </div>
                    `;
                    return;
                }

                messagesContainer.innerHTML = '';
                const picker = document.createElement('div');
                picker.className = 'session-picker';

                const title = document.createElement('h2');
                title.textContent = 'Sessoes Disponiveis';
                picker.appendChild(title);

                const list = document.createElement('div');
                list.className = 'session-list';

                for (const session of data.sessions) {
                    const item = document.createElement('div');
                    item.className = 'session-item';
                    item.onclick = () => {
                        window.location.href = `/?session=${session.id}`;
                    };

                    const left = document.createElement('div');
                    const idSpan = document.createElement('div');
                    idSpan.className = 'session-item-id';
                    idSpan.textContent = session.id.substring(0, 16) + '...';
                    left.appendChild(idSpan);

                    const metaSpan = document.createElement('div');
                    metaSpan.className = 'session-item-meta';
                    metaSpan.textContent = formatDateTime(session.timestamp);
                    left.appendChild(metaSpan);

                    const right = document.createElement('span');
                    right.className = 'session-item-size';
                    right.textContent = session.size_kb + ' KB';

                    item.appendChild(left);
                    item.appendChild(right);
                    list.appendChild(item);
                }

                picker.appendChild(list);
                messagesContainer.appendChild(picker);
            } catch (err) {
                messagesContainer.innerHTML = `
                    <div style="text-align:center; padding:3rem; color: var(--error);">
                        Erro: ${escapeHtml(err.message)}<br>
                        <small>O servidor esta rodando?</small>
                    </div>
                `;
            }
        }

        // =====================================================================
        // CHAT (enviar nova mensagem)
        // =====================================================================

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            messagesContainer.appendChild(
                createMessageElement('user', text, new Date().toISOString())
            );
            messageInput.value = '';
            sendBtn.disabled = true;
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Placeholder resposta
            const responseEl = createMessageElement('assistant', '...', new Date().toISOString());
            messagesContainer.appendChild(responseEl);

            try {
                const res = await fetch(`${API_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text }),
                });
                const data = await res.json();
                const body = responseEl.querySelector('.message-body');
                if (body) {
                    body.innerHTML = escapeHtml(data.response).replace(/\n/g, '<br>');
                }
            } catch (err) {
                const body = responseEl.querySelector('.message-body');
                if (body) {
                    body.textContent = 'Erro: ' + err.message;
                }
            }

            sendBtn.disabled = false;
            messageInput.focus();
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Event listeners
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Auto-resize textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
        });

        // =====================================================================
        // INIT
        // =====================================================================

        if (SESSION_ID) {
            loadSession(SESSION_ID);
        } else {
            loadSessionList();
        }
    </script>
</body>
</html>
